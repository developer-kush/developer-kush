<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xhtml="http://www.w3.org/1999/xhtml"
  width="800"
  height="500"
  viewBox="0 0 800 500"
>
  <style>
    /* SVG hover */
    #svgBox {
      fill: #3498db;
      transition: 0.2s;
    }

    #svgBox:hover {
      fill: #e74c3c;
      transform: scale(1.05);
      transform-origin: center;
    }

    /* SVG group hover */
    #character {
      transition: 0.2s;
    }

    #character:hover {
      transform: translateY(-15px);
    }

    /* foreignObject / HTML hover */
    .card {
      width: 220px;
      height: 100px;
      background: #222;
      color: white;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
      font-family: sans-serif;
      transition: 0.3s;
    }

    .card:hover {
      background: #27ae60;
      transform: scale(1.1);
    }

    .card:hover .hidden {
      opacity: 1;
    }

    .hidden {
      opacity: 0;
      transition: 0.3s;
      font-size: 12px;
    }

    /* Pointer-event test */
    #pointerTest {
      fill: #9b59b6;
    }

    #pointerTest:hover {
      fill: #f1c40f;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="500" fill="#111827"/>

  <!-- ====================================== -->
  <!-- TEST 1: Normal SVG :hover             -->
  <!-- ====================================== -->

  <text
    x="50"
    y="50"
    fill="white"
    font-family="sans-serif"
    font-size="20"
  >
    TEST 1 — SVG :hover
  </text>

  <rect
    id="svgBox"
    x="50"
    y="80"
    width="200"
    height="100"
    rx="15"
  />

  <text
    x="100"
    y="140"
    fill="white"
    font-family="sans-serif"
    font-size="18"
    pointer-events="none"
  >
    HOVER ME
  </text>


  <!-- ====================================== -->
  <!-- TEST 2: SVG group hover                -->
  <!-- ====================================== -->

  <text
    x="300"
    y="50"
    fill="white"
    font-family="sans-serif"
    font-size="20"
  >
    TEST 2 — SVG group
  </text>

  <g id="character">
    <!-- body -->
    <circle
      cx="400"
      cy="130"
      r="45"
      fill="#ecf0f1"
    />

    <!-- eyes -->
    <circle cx="385" cy="120" r="6"/>
    <circle cx="415" cy="120" r="6"/>

    <!-- mouth -->
    <path
      d="M380 145 Q400 160 420 145"
      fill="none"
      stroke="black"
      stroke-width="4"
    />
  </g>

  <text
    x="340"
    y="200"
    fill="white"
    font-family="sans-serif"
    font-size="14"
  >
    Hover character
  </text>


  <!-- ====================================== -->
  <!-- TEST 3: foreignObject HTML hover       -->
  <!-- ====================================== -->

  <text
    x="50"
    y="270"
    fill="white"
    font-family="sans-serif"
    font-size="20"
  >
    TEST 3 — foreignObject :hover
  </text>

  <foreignObject
    x="50"
    y="300"
    width="250"
    height="130"
  >
    <div
      xmlns="http://www.w3.org/1999/xhtml"
      class="card"
    >
      <strong>HOVER THIS CARD</strong>

      <div class="hidden">
        🎉 HTML inside SVG is reacting!
      </div>
    </div>
  </foreignObject>


  <!-- ====================================== -->
  <!-- TEST 4: Pointer events                 -->
  <!-- ====================================== -->

  <text
    x="350"
    y="270"
    fill="white"
    font-family="sans-serif"
    font-size="20"
  >
    TEST 4 — pointer events
  </text>

  <rect
    id="pointerTest"
    x="350"
    y="300"
    width="200"
    height="100"
    rx="20"
    style="pointer-events: all"
  />

  <text
    x="390"
    y="360"
    fill="white"
    font-family="sans-serif"
    font-size="18"
    pointer-events="none"
  >
    HOVER ME
  </text>


  <!-- Status -->
  <text
    x="50"
    y="470"
    fill="#aaa"
    font-family="monospace"
    font-size="14"
  >
    If these react here but not on GitHub, GitHub's embedding is the problem.
  </text>

</svg>